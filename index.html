<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        :root {
            --bg: #f6f5f1;
            --card: #ffffff;
            --text: #26302c;
            --muted: #6a746f;
            --line: #e4e2da;
            --accent: #2f6f62;
            --accent-soft: #e4efeb;
            --weather: #b8741a;
            --weather-soft: #f6ead6;
            --error: #b3412f;
            --shadow: 0 1px 3px rgba(40, 50, 45, .06), 0 6px 18px rgba(40, 50, 45, .05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #151a1b;
                --card: #1e2425;
                --text: #e6ebe8;
                --muted: #98a39d;
                --line: #2e3637;
                --accent: #6fb7a6;
                --accent-soft: #22332f;
                --weather: #e0a458;
                --weather-soft: #3a2f1f;
                --error: #e58a78;
                --shadow: none;
            }
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }
        main { max-width: 720px; margin: 0 auto; padding: 40px 20px 64px; }

        .hero { margin-bottom: 28px; }
        .hero h1 { margin: 0 0 8px; font-size: 1.7rem; line-height: 1.3; letter-spacing: -0.01em; }
        .hero p { margin: 0; color: var(--muted); }

        form { display: flex; gap: 10px; }
        #q {
            flex: 1; min-width: 0;
            padding: 14px 16px;
            font: inherit;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        #q::placeholder { color: var(--muted); }
        #q:focus, button:focus-visible, .chip:focus-visible, summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        #send {
            padding: 0 22px;
            font: inherit; font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 12px;
            cursor: pointer;
        }
        @media (prefers-color-scheme: dark) { #send { color: #10201c; } }
        #send:disabled { opacity: .55; cursor: default; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
        .chip {
            padding: 6px 14px;
            font: inherit; font-size: .9rem;
            color: var(--accent);
            background: var(--accent-soft);
            border: 0;
            border-radius: 999px;
            cursor: pointer;
        }

        .card {
            margin-top: 22px;
            padding: 22px 24px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }
        .card h2 { margin: 0 0 12px; font-size: .85rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }

        #status { margin-top: 22px; color: var(--muted); }
        #error { margin-top: 22px; color: var(--error); }

        #answer p { margin: 0 0 14px; }
        #answer p:last-child { margin-bottom: 0; }
        #answer .item { padding-left: 1.4em; text-indent: -1.4em; }
        #answer strong { color: var(--accent); font-weight: 700; }

        #map { height: 300px; margin-top: 20px; border-radius: 12px; border: 1px solid var(--line); }
        .mapnote { margin: 8px 0 0; font-size: .8rem; color: var(--muted); }

        details.steps summary { cursor: pointer; font-size: .9rem; font-weight: 600; color: var(--muted); }
        .step { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
        .step:first-of-type { border-top: 0; }
        .badge { display: inline-block; padding: 1px 10px; font-size: .8rem; font-weight: 600; border-radius: 999px; }
        .badge.find_spots { color: var(--accent); background: var(--accent-soft); }
        .badge.get_weather { color: var(--weather); background: var(--weather-soft); }
        .step .what { margin: 6px 0 0; font-size: .95rem; }
        .step details { margin-top: 6px; font-size: .8rem; color: var(--muted); }
        .step code {
            display: block; margin-top: 6px; padding: 10px 12px;
            font-family: ui-monospace, Consolas, monospace; font-size: .78rem; line-height: 1.5;
            white-space: pre-wrap; word-break: break-all;
            background: var(--bg); border-radius: 8px;
        }

        .leaflet-container { font-family: inherit; }
        @media (max-width: 480px) {
            main { padding: 28px 16px 48px; }
            .hero h1 { font-size: 1.45rem; }
            .card { padding: 18px; }
        }
    </style>
</head>
<body>
    <main>
        <section class="hero">
            <h1>🏝️ 제주 여행 추천</h1>
            <p>가고 싶은 지역이나 상황을 말해 주세요. 관광지 목록과 현재 날씨를 확인해서 알맞은 곳을 골라 드려요.</p>
        </section>

        <form id="form">
            <input id="q" placeholder="예) 서귀포에서 오늘 가기 좋은 곳 알려줘" maxlength="200" autocomplete="off" aria-label="질문">
            <button id="send" type="submit">추천받기</button>
        </form>

        <div class="chips" id="chips">
            <button type="button" class="chip">제주시에서 오늘 가기 좋은 곳 추천해줘</button>
            <button type="button" class="chip">동쪽에서 비 와도 갈 만한 곳 있어?</button>
            <button type="button" class="chip">서쪽 야외 관광지 추천해줘</button>
        </div>

        <div id="status" hidden></div>
        <div id="error" role="alert"></div>

        <section class="card" id="answerBox" hidden>
            <h2>추천</h2>
            <div id="answer"></div>
            <div id="map"></div>
            <p class="mapnote" id="mapnote">지도의 위치는 지역 중심 기준의 대략적인 위치예요.</p>
        </section>

        <section class="card" id="stepBox" hidden>
            <details class="steps">
                <summary>에이전트가 한 일 보기</summary>
                <div id="steps"></div>
            </details>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 장소별 좌표가 없어서, 지역(areas)의 중심 좌표에 묶어서 표시한다. (대략적인 위치)
        const center = {
            "동쪽(성산)": [33.458, 126.942],
            "동쪽(구좌)": [33.520, 126.850],
            "제주시":     [33.500, 126.531],
            "서쪽(한림)": [33.414, 126.268],
            "서쪽(안덕)": [33.265, 126.330],
            "서귀포":     [33.254, 126.560]
        }
        const toolLabel = { find_spots: "관광지 검색", get_weather: "날씨 확인" }

        const form = document.getElementById("form")
        const q = document.getElementById("q")
        const send = document.getElementById("send")
        const statusEl = document.getElementById("status")
        const errorBox = document.getElementById("error")
        const stepBox = document.getElementById("stepBox")
        const stepsEl = document.getElementById("steps")
        const answerBox = document.getElementById("answerBox")
        const answerEl = document.getElementById("answer")

        let map = null
        let layer = null

        for (const chip of document.querySelectorAll(".chip")) {
            chip.addEventListener("click", () => { q.value = chip.textContent; form.requestSubmit() })
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault()
            const message = q.value.trim()
            if (!message) return

            send.disabled = true
            send.textContent = "찾는 중..."
            statusEl.textContent = "관광지와 날씨를 확인하고 있어요. 잠시만 기다려 주세요."
            statusEl.hidden = false
            errorBox.textContent = ""
            stepBox.hidden = true
            answerBox.hidden = true

            try {
                const res = await fetch("/api/agent", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                })
                const data = await res.json()
                if (!res.ok) throw new Error(data.error || "요청에 실패했어요.")
                show(data)
            } catch (err) {
                errorBox.textContent = "문제가 생겼어요: " + err.message
            } finally {
                statusEl.hidden = true
                send.disabled = false
                send.textContent = "추천받기"
            }
        })

        // **굵게** 표시만 지원하는 간단한 변환. 모든 글자는 textContent 로 넣어서 안전하다.
        function renderAnswer(text) {
            answerEl.textContent = ""
            for (const raw of text.split("\n")) {
                const line = raw.trim()
                if (!line) continue
                const p = document.createElement("p")
                const isItem = /^(\d+[.)]|[-*•])\s+/.test(line)
                if (isItem) p.className = "item"
                const cleaned = isItem && /^[-*•]\s+/.test(line) ? "• " + line.replace(/^[-*•]\s+/, "") : line
                cleaned.split(/(\*\*[^*]+\*\*)/).forEach(part => {
                    if (/^\*\*[^*]+\*\*$/.test(part)) {
                        const b = document.createElement("strong")
                        b.textContent = part.slice(2, -2)
                        p.appendChild(b)
                    } else if (part) {
                        p.appendChild(document.createTextNode(part))
                    }
                })
                answerEl.appendChild(p)
            }
        }

        function describe(step) {
            const a = step.input || {}
            if (step.tool === "get_weather") {
                const o = step.output || {}
                if (o.error) return a.area + " 날씨를 가져오지 못했어요."
                return a.area + " 날씨 확인: " + o.description + ", " + o.temp + "°C (오늘 비 올 확률 " + o.today_rain_chance_percent + "%)"
            }
            const kind = a.indoor === true ? "실내" : a.indoor === false ? "야외" : "전체"
            const total = step.output && step.output.total
            return a.area + (a.dong ? " " + a.dong : "") + " " + kind + " 관광지 검색" + (total !== undefined ? ": " + total + "곳 중 일부" : "")
        }

        function show(data) {
            renderAnswer(data.reply || "추천 결과가 비어 있어요.")
            answerBox.hidden = false

            stepsEl.textContent = ""
            if (data.steps.length === 0) {
                stepsEl.textContent = "도구를 호출하지 않고 바로 답했어요."
            }
            for (const s of data.steps) {
                const div = document.createElement("div")
                div.className = "step"

                const badge = document.createElement("span")
                badge.className = "badge " + s.tool
                badge.textContent = toolLabel[s.tool] || s.tool

                const what = document.createElement("p")
                what.className = "what"
                what.textContent = describe(s)

                const detail = document.createElement("details")
                const sum = document.createElement("summary")
                sum.textContent = "자세히 (" + s.tool + ")"
                const input = document.createElement("code")
                input.textContent = "입력: " + JSON.stringify(s.input)
                const output = document.createElement("code")
                const text = JSON.stringify(s.output)
                output.textContent = "결과: " + (text.length > 400 ? text.slice(0, 400) + "..." : text)
                detail.append(sum, input, output)

                div.append(badge, what, detail)
                stepsEl.appendChild(div)
            }
            stepBox.hidden = false

            // find_spots 가 돌려준 장소를 지역 중심에 마커로 찍는다.
            const groups = {}
            for (const s of data.steps) {
                if (s.tool !== "find_spots" || !s.output.spots) continue
                for (const spot of s.output.spots) {
                    (groups[spot.areas] = groups[spot.areas] || []).push(spot)
                }
            }

            const mapEl = document.getElementById("map")
            const hasPlaces = Object.keys(groups).length > 0
            mapEl.hidden = !hasPlaces
            document.getElementById("mapnote").hidden = !hasPlaces
            if (!hasPlaces) return

            if (!map) {
                map = L.map("map").setView([33.38, 126.55], 9)
                L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    maxZoom: 18,
                    attribution: "&copy; OpenStreetMap"
                }).addTo(map)
                layer = L.layerGroup().addTo(map)
            }
            layer.clearLayers()
            map.invalidateSize()

            const points = []
            for (const [name, spots] of Object.entries(groups)) {
                const pos = center[name]
                if (!pos) continue
                points.push(pos)
                const popup = document.createElement("div")
                const title = document.createElement("b")
                title.textContent = name
                popup.appendChild(title)
                for (const s of spots) {
                    const line = document.createElement("div")
                    line.textContent = s.name + " · " + (s.indoor ? "실내" : "야외") + " · " + s.description
                    popup.appendChild(line)
                }
                L.marker(pos).addTo(layer).bindPopup(popup).bindTooltip(name + " " + spots.length + "곳")
            }
            if (points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 11 })
        }
    </script>
</body>
</html>
