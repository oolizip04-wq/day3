<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: #f4f7fb; color: #1d2433; }
        header { padding: 16px; background: #0f4c81; color: #fff; }
        h1 { margin: 0 0 4px; font-size: 1.3rem; }
        .sub { font-size: .85rem; opacity: .85; }
        main { max-width: 760px; margin: 0 auto; padding: 16px; }
        form { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px 12px; font-size: 1rem; border: 1px solid #b9c4d6; border-radius: 8px; }
        button { padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 8px; background: #0f4c81; color: #fff; cursor: pointer; }
        button:disabled { background: #8aa3bd; cursor: default; }
        .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .examples span { padding: 4px 10px; font-size: .85rem; background: #e3ecf7; border-radius: 14px; cursor: pointer; }
        .box { margin-top: 14px; background: #fff; border: 1px solid #d8e0ec; border-radius: 10px; padding: 12px 14px; }
        .box h2 { margin: 0 0 8px; font-size: .95rem; color: #4a5a78; }
        .step { margin-bottom: 8px; font-size: .85rem; }
        .step code { display: block; margin-top: 2px; padding: 6px 8px; background: #f1f4f9; border-radius: 6px; white-space: pre-wrap; word-break: break-all; color: #3b4660; }
        .tool { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; font-size: .8rem; }
        .tool.find_spots { background: #2e8b57; }
        .tool.get_weather { background: #e08a1e; }
        #answer { white-space: pre-wrap; line-height: 1.6; }
        #map { height: 320px; border-radius: 8px; margin-top: 8px; }
        #error { color: #c0392b; }
    </style>
</head>
<body>
    <header>
        <h1>🏝️ 제주 여행 추천 에이전트</h1>
        <div class="sub">Claude가 관광지 목록(find_spots)과 현재 날씨(get_weather) 도구를 스스로 골라 호출해서 추천해 줘요.</div>
    </header>

    <main>
        <form id="form">
            <input id="q" placeholder="예) 서귀포에서 오늘 가기 좋은 곳 알려줘" maxlength="200" autocomplete="off">
            <button id="send" type="submit">추천받기</button>
        </form>
        <div class="examples">
            <span>제주시에서 오늘 가기 좋은 곳 추천해줘</span>
            <span>동쪽에서 비 와도 갈 만한 곳 있어?</span>
            <span>서쪽 야외 관광지 추천해줘</span>
        </div>

        <div id="error"></div>

        <div class="box" id="stepBox" hidden>
            <h2>에이전트가 한 일</h2>
            <div id="steps"></div>
        </div>

        <div class="box" id="answerBox" hidden>
            <h2>추천</h2>
            <div id="answer"></div>
            <div id="map"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 장소별 좌표가 없어서, 지역(areas)의 중심 좌표에 묶어서 표시한다. (대략적인 위치)
        const center = {
            "동쪽(성산)": [33.458, 126.942],
            "동쪽(구좌)": [33.520, 126.850],
            "제주시":     [33.500, 126.531],
            "서쪽(한림)": [33.414, 126.268],
            "서쪽(안덕)": [33.265, 126.330],
            "서귀포":     [33.254, 126.560]
        }

        const form = document.getElementById("form")
        const q = document.getElementById("q")
        const send = document.getElementById("send")
        const errorBox = document.getElementById("error")
        const stepBox = document.getElementById("stepBox")
        const stepsEl = document.getElementById("steps")
        const answerBox = document.getElementById("answerBox")
        const answerEl = document.getElementById("answer")

        let map = null
        let layer = null

        for (const ex of document.querySelectorAll(".examples span")) {
            ex.addEventListener("click", () => { q.value = ex.textContent; form.requestSubmit() })
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault()
            const message = q.value.trim()
            if (!message) return

            send.disabled = true
            send.textContent = "생각 중..."
            errorBox.textContent = ""
            stepBox.hidden = true
            answerBox.hidden = true

            try {
                const res = await fetch("/api/agent", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                })
                const data = await res.json()
                if (!res.ok) throw new Error(data.error || "요청 실패")
                show(data)
            } catch (err) {
                errorBox.textContent = "오류: " + err.message
            } finally {
                send.disabled = false
                send.textContent = "추천받기"
            }
        })

        function show(data) {
            // 에이전트가 어떤 도구를 어떤 입력으로 불렀는지 보여준다.
            stepsEl.textContent = ""
            if (data.steps.length === 0) {
                stepsEl.textContent = "도구를 호출하지 않고 바로 답했어요."
            }
            for (const s of data.steps) {
                const div = document.createElement("div")
                div.className = "step"
                const tag = document.createElement("span")
                tag.className = "tool " + s.tool
                tag.textContent = s.tool
                const input = document.createElement("code")
                input.textContent = "입력: " + JSON.stringify(s.input)
                const output = document.createElement("code")
                const text = JSON.stringify(s.output)
                output.textContent = "결과: " + (text.length > 300 ? text.slice(0, 300) + "..." : text)
                div.append(tag, input, output)
                stepsEl.appendChild(div)
            }
            stepBox.hidden = false

            answerEl.textContent = data.reply
            answerBox.hidden = false

            // find_spots 가 돌려준 장소를 지역 중심에 마커로 찍는다.
            const groups = {}
            for (const s of data.steps) {
                if (s.tool !== "find_spots" || !s.output.spots) continue
                for (const spot of s.output.spots) {
                    (groups[spot.areas] = groups[spot.areas] || []).push(spot)
                }
            }

            if (!map) {
                map = L.map("map").setView([33.38, 126.55], 9)
                L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    maxZoom: 18,
                    attribution: "&copy; OpenStreetMap"
                }).addTo(map)
                layer = L.layerGroup().addTo(map)
            }
            layer.clearLayers()
            document.getElementById("map").hidden = false
            map.invalidateSize()

            const points = []
            for (const [name, spots] of Object.entries(groups)) {
                const pos = center[name]
                if (!pos) continue
                points.push(pos)
                const popup = document.createElement("div")
                const title = document.createElement("b")
                title.textContent = name
                popup.appendChild(title)
                for (const s of spots) {
                    const line = document.createElement("div")
                    line.textContent = s.name + " · " + (s.indoor ? "실내" : "야외") + " · " + s.description
                    popup.appendChild(line)
                }
                L.marker(pos).addTo(layer).bindPopup(popup).bindTooltip(name + " " + spots.length + "곳")
            }
            if (points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 11 })
            document.getElementById("map").hidden = points.length === 0
        }
    </script>
</body>
</html>
