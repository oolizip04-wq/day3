<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 지진 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: #0b0f1a; color: #e8ecf5; }
        header { padding: 14px 16px 6px; }
        h1 { margin: 0 0 4px; font-size: 1.4rem; }
        .sub { color: #8b95ad; font-size: .85rem; }
        .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 16px; }
        select, button { background: #1a2238; color: #e8ecf5; border: 1px solid #2c3757; border-radius: 6px; padding: 6px 10px; font-size: .95rem; }
        .stats { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 10px; }
        .card { background: #131a2c; border: 1px solid #222c47; border-radius: 8px; padding: 8px 14px; }
        .card b { display: block; font-size: 1.3rem; }
        .card span { color: #8b95ad; font-size: .8rem; }
        #map { height: 58vh; min-height: 320px; margin: 0 16px; border-radius: 10px; background: #0b0f1a; }
        .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px; font-size: .8rem; color: #8b95ad; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
        h2 { margin: 6px 16px; font-size: 1.05rem; }
        #list { list-style: none; margin: 0; padding: 0 16px 24px; }
        #list li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; margin-bottom: 6px; background: #131a2c; border: 1px solid #222c47; border-radius: 8px; cursor: pointer; }
        #list li:hover { border-color: #4a5a8c; }
        .mag { min-width: 46px; text-align: center; font-weight: bold; border-radius: 6px; padding: 4px 0; color: #111; }
        .meta { font-size: .8rem; color: #8b95ad; }
        .pulse { width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, .85); animation: pulse 1.6s ease-out infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .7); } 100% { box-shadow: 0 0 0 28px rgba(255, 255, 255, 0); } }
    </style>
</head>
<body>
    <header>
        <h1>🌍 실시간 지진 지도</h1>
        <div class="sub">USGS(미국 지질조사국) 공공데이터 · 1분마다 자동 갱신 · 원이 클수록 강한 지진</div>
    </header>

    <div class="bar">
        <label>보기
            <select id="feed">
                <option value="all_hour">최근 1시간 (전체)</option>
                <option value="2.5_day" selected>최근 24시간 (규모 2.5+)</option>
                <option value="2.5_week">최근 7일 (규모 2.5+)</option>
                <option value="4.5_month">최근 30일 (규모 4.5+)</option>
            </select>
        </label>
        <button id="reload">새로고침</button>
        <span id="status" class="sub"></span>
    </div>

    <div class="stats">
        <div class="card"><b id="s-count">-</b><span>지진 횟수</span></div>
        <div class="card"><b id="s-max">-</b><span>최대 규모</span></div>
        <div class="card"><b id="s-latest">-</b><span>가장 최근</span></div>
    </div>

    <div id="map"></div>

    <div class="legend" id="legend"></div>

    <h2>강한 지진 TOP 10 (누르면 지도로 이동)</h2>
    <ul id="list"></ul>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const BASE = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/"

        // 규모 -> 색 (밝은 노랑 → 주황 → 빨강 → 자주)
        const colors = [
            { min: 0, color: "#ffe066", label: "~3" },
            { min: 3, color: "#ffb02e", label: "3~4" },
            { min: 4, color: "#ff6b35", label: "4~5" },
            { min: 5, color: "#ff2e4d", label: "5~6" },
            { min: 6, color: "#d61fd6", label: "6+" }
        ]
        const colorOf = (mag) => colors.filter(c => mag >= c.min).pop().color

        document.getElementById("legend").innerHTML = colors
            .map(c => `<span><i style="background:${c.color}"></i>규모 ${c.label}</span>`).join("")

        const map = L.map("map", { worldCopyJump: true }).setView([20, 130], 2)
        L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
            maxZoom: 10,
            attribution: "&copy; OpenStreetMap &copy; CARTO · 지진 데이터 USGS"
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const feedSelect = document.getElementById("feed")
        const status = document.getElementById("status")
        const list = document.getElementById("list")

        const fmt = (t) => new Date(t).toLocaleString("ko-KR")

        async function load() {
            status.textContent = "불러오는 중..."
            try {
                const res = await fetch(BASE + feedSelect.value + ".geojson")
                if (!res.ok) throw new Error("USGS 응답 오류 (" + res.status + ")")
                const data = await res.json()
                draw(data.features)
                status.textContent = "갱신: " + new Date().toLocaleTimeString("ko-KR")
            } catch (err) {
                status.textContent = "오류: " + err.message
            }
        }

        function draw(quakes) {
            layer.clearLayers()
            list.textContent = ""

            const valid = quakes.filter(q => q.properties.mag !== null)
            valid.sort((a, b) => b.properties.mag - a.properties.mag)

            document.getElementById("s-count").textContent = valid.length.toLocaleString()
            document.getElementById("s-max").textContent = valid.length ? valid[0].properties.mag.toFixed(1) : "-"
            const latest = valid.reduce((m, q) => Math.max(m, q.properties.time), 0)
            document.getElementById("s-latest").textContent = latest ? Math.max(0, Math.round((Date.now() - latest) / 60000)) + "분 전" : "-"

            const hourAgo = Date.now() - 60 * 60 * 1000

            // 약한 지진을 먼저 그려서 강한 지진이 위에 보이게 한다.
            for (const q of [...valid].reverse()) {
                const p = q.properties
                const [lng, lat, depth] = q.geometry.coordinates
                const color = colorOf(p.mag)

                const circle = L.circleMarker([lat, lng], {
                    radius: Math.max(4, p.mag * p.mag * 0.9),
                    color: color,
                    weight: 1,
                    fillColor: color,
                    fillOpacity: 0.45
                }).addTo(layer)

                const box = document.createElement("div")
                const title = document.createElement("b")
                title.textContent = "규모 " + p.mag.toFixed(1)
                box.appendChild(title)
                for (const text of [p.place || "위치 정보 없음", fmt(p.time), "깊이 " + Math.round(depth) + " km"]) {
                    const line = document.createElement("div")
                    line.textContent = text
                    box.appendChild(line)
                }
                if (p.url) {
                    const a = document.createElement("a")
                    a.href = p.url
                    a.target = "_blank"
                    a.rel = "noopener"
                    a.textContent = "USGS 상세 보기"
                    box.appendChild(a)
                }
                circle.bindPopup(box)

                // 최근 1시간 안에 일어난 지진은 깜빡이는 파동으로 표시한다.
                if (p.time > hourAgo) {
                    L.marker([lat, lng], {
                        icon: L.divIcon({ className: "", html: '<div class="pulse"></div>', iconSize: [18, 18] }),
                        interactive: false
                    }).addTo(layer)
                }
            }

            for (const q of valid.slice(0, 10)) {
                const p = q.properties
                const [lng, lat] = q.geometry.coordinates
                const li = document.createElement("li")

                const mag = document.createElement("div")
                mag.className = "mag"
                mag.style.background = colorOf(p.mag)
                mag.textContent = p.mag.toFixed(1)

                const info = document.createElement("div")
                const place = document.createElement("div")
                place.textContent = p.place || "위치 정보 없음"
                const meta = document.createElement("div")
                meta.className = "meta"
                meta.textContent = fmt(p.time)
                info.append(place, meta)

                li.append(mag, info)
                li.addEventListener("click", () => {
                    map.flyTo([lat, lng], 5)
                    window.scrollTo({ top: 0, behavior: "smooth" })
                })
                list.appendChild(li)
            }
        }

        feedSelect.addEventListener("change", load)
        document.getElementById("reload").addEventListener("click", load)
        setInterval(load, 60000)
        load()
    </script>
</body>
</html>
